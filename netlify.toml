# 357Network job-platform deployment.
# TanStack Start SSR/server functions are handled by Netlify's official Vite adapter.

[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

[dev]
  command = "bun run dev"
  port = 3000

# Secrets are intentionally NOT stored here. Configure these in Netlify:
# VITE_SUPABASE_URL
# VITE_SUPABASE_PUBLISHABLE_KEY
# SUPABASE_URL
# SUPABASE_PUBLISHABLE_KEY
# SUPABASE_SERVICE_ROLE_KEY
# BROWSERBASE_API_KEY
# BROWSERBASE_PROJECT_ID
# AUTOMATION_ENABLE_SUBMIT (keep false until a controlled submission test is approved)
