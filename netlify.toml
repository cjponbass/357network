# 357Network job-platform deployment.
# TanStack Start SSR/server functions are handled by Netlify's official Vite adapter.
# Keep the hosting runtime aligned with the Node 22 + pnpm toolchain verified in CI.

[build]
  command = "pnpm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

[dev]
  command = "pnpm run dev"
  port = 3000

# Baseline browser hardening that is safe for the current SPA/SSR architecture.
# A strict Content-Security-Policy will be added only after the live deployment
# inventory is known, so we do not accidentally break Supabase or server assets.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Candidate account/application pages can contain private profile, document,
# answer, and application data. Explicitly prevent browser/CDN caching.
[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/applications/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/profile"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/settings"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/documents"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/answers"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/prepare"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

# The approved panoramic brand artwork is versioned in Git and can be cached.
[[headers]]
  for = "/357-network-header.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Secrets are intentionally NOT stored here. Configure these in Netlify:
# VITE_SUPABASE_URL
# VITE_SUPABASE_PUBLISHABLE_KEY
# SUPABASE_URL
# SUPABASE_PUBLISHABLE_KEY
# SUPABASE_SERVICE_ROLE_KEY
# OPENAI_API_KEY
# OPENAI_MODEL (optional; defaults to gpt-4o-mini)
# BROWSERBASE_API_KEY
# BROWSERBASE_PROJECT_ID
# AUTOMATION_ENABLE_SUBMIT (keep false until a controlled submission test is approved and passed)
