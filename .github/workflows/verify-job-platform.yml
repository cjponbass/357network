name: Verify Job Platform

on:
  push:
    branches: [job-platform-rebuild]
  pull_request:
    branches: [job-platform-rebuild]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # TODO: switch back to --frozen-lockfile as soon as pnpm-lock.yaml is committed.
        # The repository currently has no lockfile, so frozen installs cannot succeed.
        run: npx --yes pnpm@10.15.0 install --no-frozen-lockfile
      - name: Preserve generated lockfile
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Typecheck
        run: npx --yes pnpm@10.15.0 run typecheck
      - name: Lint
        run: npx --yes pnpm@10.15.0 run lint
      - name: Test
        run: npx --yes pnpm@10.15.0 run test
      - name: Production build
        run: npx --yes pnpm@10.15.0 run build
