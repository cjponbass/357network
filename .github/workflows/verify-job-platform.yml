name: Verify Job Platform

on:
  push:
    branches: [job-platform-rebuild, feature/live-supabase-integration]
  pull_request:
    branches: [job-platform-rebuild, feature/live-supabase-integration]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx --yes pnpm@10.15.0 install --frozen-lockfile
      - name: Typecheck
        run: npx --yes pnpm@10.15.0 run typecheck
      - name: Lint
        run: npx --yes pnpm@10.15.0 run lint
      - name: Test
        run: npx --yes pnpm@10.15.0 run test
      - name: Production build
        run: npx --yes pnpm@10.15.0 run build
