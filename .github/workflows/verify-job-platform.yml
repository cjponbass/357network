name: Verify Job Platform

on:
  push:
    branches: [job-platform-rebuild]
  pull_request:
    branches: [job-platform-rebuild]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx --yes pnpm@10.15.0 install --no-frozen-lockfile
      - name: Commit generated lockfile when missing
        if: ${{ github.event_name == 'push' && hashFiles('pnpm-lock.yaml') != '' }}
        shell: bash
        run: |
          if git cat-file -e "HEAD:pnpm-lock.yaml" 2>/dev/null; then
            echo "pnpm-lock.yaml is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Commit generated pnpm lockfile"
          git push origin HEAD:job-platform-rebuild
      - name: Typecheck
        run: npx --yes pnpm@10.15.0 run typecheck
      - name: Lint
        run: npx --yes pnpm@10.15.0 run lint
      - name: Test
        run: npx --yes pnpm@10.15.0 run test
      - name: Production build
        run: npx --yes pnpm@10.15.0 run build
