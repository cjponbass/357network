name: Verify Job Platform

on:
  push:
    branches: [job-platform-rebuild]
  pull_request:
    branches: [job-platform-rebuild]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun install; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency install failed on attempt $attempt; retrying after transient registry failure..."
              sleep $((attempt * 5))
            fi
          done
          echo "Dependency installation failed after 3 attempts."
          exit 1
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Production build
        run: bun run build
